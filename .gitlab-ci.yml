image: node:20

stages:
  - lint
  - build
  - test
  - db:migrate
  - deploy

variables:
  PNPM_CACHE_FOLDER: '.pnpm-store'

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - corepack enable
  - corepack prepare pnpm@latest-9 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

lint:
  stage: lint
  script:
    - pnpm run lint

build:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - apps/web/.next
      - apps/api/dist

test:
  stage: test
  script:
    - pnpm run test

db:migrate:
  stage: db:migrate
  script:
    - echo "Executing Prisma migrations"
    - cd packages/database && pnpm dlx prisma migrate deploy
  only:
    - main

deploy-placeholder:
  stage: deploy
  script:
    - echo "Deploy process to be implemented"
  only:
    - main
